name: api
on:
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["apps/api/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: apps/api/go.mod, cache-dependency-path: apps/api/go.sum }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
