openapi: 3.0.3
info:
  title: ImageFlow API
  version: 1.0.0
servers:
  - url: /api/v1
components:
  securitySchemes:
    apiKey: {type: http, scheme: bearer}
paths:
  /health:
    get:
      operationId: healthCheck
      responses:
        '200': {description: Process is alive}
  /ready:
    get:
      operationId: readinessCheck
      responses:
        '200': {description: Database is reachable}
        '503': {description: Database is not reachable}
  /jobs:
    get:
      operationId: listJobs
      summary: List the caller's jobs, newest first
      security: [{apiKey: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: before, in: query, description: "created_at cursor (RFC 3339); use meta.next_before from the previous page", schema: {type: string, format: date-time}}
      responses:
        '200': {description: "Jobs without items, each with counts {total, completed, failed}"}
        '401': {description: Missing or invalid API key}
        '422': {description: Invalid limit or before}
    post:
      operationId: createJob
      summary: Create an image-processing job from source URLs
      security: [{apiKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_urls]
              properties:
                source_urls: {type: array, minItems: 1, items: {type: string, format: uri}}
                webhook_url: {type: string, format: uri}
      responses:
        '202': {description: Job accepted (standard envelope; Location header points at the job)}
        '401': {description: Missing or invalid API key}
        '422': {description: Invalid request or a URL that is not allowed}
  /jobs/{id}:
    get:
      operationId: getJob
      summary: Get a job and its items
      security: [{apiKey: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: The job (standard envelope)}
        '401': {description: Missing or invalid API key}
        '404': {description: No such job for this key}
  /jobs/{id}/items/{position}/output:
    get:
      operationId: getItemOutput
      summary: Download the processed image of a completed item
      security: [{apiKey: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: position, in: path, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: The compressed image
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '401': {description: Missing or invalid API key}
        '404': {description: No such completed item for this key}
  /jobs/{id}/items/{position}/output-url:
    get:
      operationId: getItemOutputUrl
      summary: Get a short-lived direct download URL for a completed item (S3-compatible storage only)
      security: [{apiKey: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: position, in: path, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: "Envelope with data {url, expires_in}; the URL needs no API key"}
        '401': {description: Missing or invalid API key}
        '404': {description: No such completed item for this key}
        '501': {description: The deployment uses local storage; use /output instead}
