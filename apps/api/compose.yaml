# Local development stack for the v2 API. Secrets here are dev-only.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: imageflow
      POSTGRES_PASSWORD: imageflow
      POSTGRES_DB: imageflow
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imageflow"]
      interval: 3s
      retries: 20
  migrate:
    image: ghcr.io/pressly/goose:latest
    depends_on: { db: { condition: service_healthy } }
    volumes: ["./migrations:/migrations:ro"]
    command: ["-dir", "/migrations", "postgres", "postgres://imageflow:imageflow@db:5432/imageflow?sslmode=disable", "up"]
  api:
    build: .
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://imageflow:imageflow@db:5432/imageflow?sslmode=disable
      API_KEYS: dev-key-change-me
    ports: ["127.0.0.1:8080:8080"]
